
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11110f">
  <meta name="description" content="ARIA Atmosphere creates thoughtfully curated musical environments and immersive live experiences for wellness, hospitality and meaningful gatherings.">
  <title>ARIA Atmosphere | Music for Presence & Connection</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --dark: #11110f;
      --dark-soft: #191916;
      --cream: #eee9df;
      --muted: #aaa69c;
      --gold: #c6aa7b;
      --line: rgba(238,233,223,0.17);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 26px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .logo {
      font-family: var(--serif);
      font-size: 32px;
      letter-spacing: 7px;
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 35px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-links a {
      transition: color .3s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-cta {
      border: 1px solid var(--gold);
      padding: 11px 20px;
    }

    .hero {
      min-height: 760px;
      height: 100vh;
      height: 100svh;
      max-height: 1000px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--dark);
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(
          180deg,
          rgba(10,10,9,.48),
          rgba(10,10,9,.38) 45%,
          rgba(17,17,15,.82) 100%
        );
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      padding: 120px 8% 70px;
      animation: reveal 1.5s ease both;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .hero h1 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(48px, 7vw, 82px);
      line-height: 1.05;
    }

    .hero-description {
      max-width: 650px;
      margin: 30px auto 0;
      color: rgba(238,233,223,.85);
      font-size: 14px;
      line-height: 2;
    }

    .hero-subtext {
      max-width: 620px;
      margin: 18px auto 0;
      color: rgba(238,233,223,.72);
      font-size: 12px;
      line-height: 2;
    }

    .hero-signature {
      margin-top: 35px;
      font-family: var(--serif);
      font-size: 22px;
      font-style: italic;
      color: var(--cream);
      letter-spacing: 1px;
    }

    .hero-actions {
      margin-top: 38px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all .3s ease;
    }

    .button-gold {
      background: var(--gold);
      color: #171611;
    }

    .button-gold:hover {
      background: var(--cream);
    }

    .button-outline {
      border: 1px solid rgba(238,233,223,.65);
    }

    .button-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .scroll-note {
      position: absolute;
      z-index: 2;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .nav {
        padding: 20px 6%;
      }

      .nav-links {
        gap: 15px;
        font-size: 9px;
      }

      .logo {
        font-size: 27px;
      }

      .nav-cta {
        padding: 8px 12px;
      }

      .hero {
        min-height: 700px;
      }

      .hero-content {
        padding: 110px 7% 70px;
      }

      .eyebrow {
        font-size: 9px;
        letter-spacing: 3px;
      }

      .hero-description {
        font-size: 13px;
      }

      .hero-subtext {
        font-size: 11px;
      }

      .hero-signature {
        font-size: 20px;
      }

      .scroll-note {
        bottom: 24px;
      }
    }

    @media (max-width: 380px) {
      .nav-links {
        gap: 10px;
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <nav class="nav">
    <a href="/" class="logo">ARIA</a>

    <div class="nav-links">
      <a href="/">ARIA Live</a>
      <a href="mailto:bookings@ariaviolin.com" class="nav-cta">Enquire</a>
    </div>
  </nav>

  <header class="hero">

    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
      aria-hidden="true">
      <source
        src="https://res.cloudinary.com/ykzoh2xo/video/upload/q_auto:good,w_1920/v1795512984/13590302_3840_2160_60fps.mp4"
        type="video/mp4">
    </video>

    <div class="hero-content">
      <div class="eyebrow">
        ARIA Atmosphere · Cape Town · Beyond
      </div>

      <h1>Music curation for healing spaces and experiences.</h1>

      </p>

      <div class="hero-signature">
        Music for presence. Music for connection. Music for feeling.
      </div>

      <div class="hero-actions">
        <a href="#art-of-atmosphere" class="button button-gold">
          Discover Atmosphere
        </a>

        <a href="mailto:bookings@ariaviolin.com" class="button button-outline">
          Enquire
        </a>
      </div>
    </div>

    <div class="scroll-note">
      Scroll to discover &nbsp; ↓
    </div>

  </header>

</body>
</html>
